name: Mobile browser smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install application
        run: npm ci
      - name: Install isolated Playwright browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Build standalone Hikone2 frontend
        run: npm run build
        env:
          VERCEL: '1'
      - name: Run mobile-device-emulation smoke checks
        run: node scripts/mobile-smoke.mjs
        env:
          VERCEL: '1'
