name: One-time Hikone2 Maps routing verification

on:
  push:
    branches: ["feat/qr-ai-full-journeys"]
    paths: [".github/workflows/route-check-once.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify one walking leg via Hikone2
        run: node scripts/check-routes-once.mjs
